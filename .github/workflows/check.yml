name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 ripgrep unzip
      - run: rustup target add x86_64-pc-windows-gnu
      - run: ./check.sh
      - run: cargo install armake2 --version 0.3.0 --locked
      - run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mumbleacre-windows-x64-candidate
          path: dist/windows-x64/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --workspace
