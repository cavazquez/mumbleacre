[workspace]
members = ["crates/mumbleacre-acre", "crates/mumbleacre-logging", "crates/mumbleacre-plugin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0"
repository = "https://github.com/cavazquez/mumbleacre"
authors = ["MumbleACRE Contributors"]

[workspace.dependencies]
mumbleacre-logging = { path = "crates/mumbleacre-logging" }
mumbleacre-acre = { path = "crates/mumbleacre-acre" }
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5.1"
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
